[package]
name = "psn-friends"
version = "0.1.0"
edition = "2021"
description = "See what your PlayStation Network friends are playing, from the terminal or the GNOME top bar"
license = "MIT"
repository = "https://github.com/danvaneijck/psn-friends"
readme = "README.md"
keywords = ["playstation", "psn", "gnome", "presence", "friends"]
categories = ["command-line-utilities"]
exclude = ["/docs", "/.github"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
strip = true
lto = "thin"

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          arch=${{ matrix.target }}; arch=${arch%%-*}
          name=psn-friends-${GITHUB_REF_NAME}-${arch}-linux
          mkdir -p "$name"
          cp target/${{ matrix.target }}/release/psn-friends install.sh README.md LICENSE "$name/"
          cp -r extension "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: psn-friends-*.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extension zip (for gnome-extensions install)
        run: |
          uuid=$(basename extension/*)
          (cd "extension/$uuid" && zip -r "$GITHUB_WORKSPACE/$uuid.shell-extension.zip" .)
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            psn-friends-*.tar.gz
            psn-friends-*.tar.gz.sha256
            *.shell-extension.zip
